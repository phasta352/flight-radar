# Flight Radar configuration
# Edit this file, then restart the app (sudo systemctl restart flightradar).

[location]
# Your position. Find it by right-clicking your house in Google Maps,
# the first number is latitude, the second is longitude.
name = "Luxembourg"
latitude = 49.6116
longitude = 6.1319

[filter]
radius_km = 25            # how far around you to look
min_altitude_ft = 0       # e.g. 500 to hide low traffic / helicopters
max_altitude_ft = 60000
include_ground = false    # show aircraft taxiing at airports?

[data]
# Tried in order; if one fails the next one is used. All free, no API key.
sources = ["airplanes.live", "adsb.fi", "adsb.lol"]
lookup_routes = true      # look up "LUX → LHR" from the callsign (adsbdb.com)
timeout_seconds = 10

[display]
# What to show next to the radar:
#   "list"    = the nearest few flights (how many: max_list, 5 or 6 fits best)
#   "nearest" = one big card with full details of the closest aircraft
mode = "list"
max_list = 5
# "preview" saves a PNG (works on any computer, good for testing)
# "waveshare" draws on a Waveshare e-Paper HAT
driver = "preview"
model = "epd7in5_V2"      # Waveshare driver module name (see README)
width = 800               # only used by the preview driver
height = 480
preview_path = "preview.png"
refresh_seconds = 45      # 30-60 s keeps fast jets on the radar (minimum 30). Each refresh flashes the e-ink briefly
units = "aviation"        # "aviation" = feet + knots, "metric" = metres + km/h
rotate = 0                # 0 or 180 if your screen is mounted upside down
